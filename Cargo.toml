[package]
name = "celsp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ponix-dev/celsp"
authors = ["ponix-dev"]
description = "Language Server Protocol implementation for CEL"
keywords = ["cel", "lsp", "language-server", "ide"]
categories = ["development-tools", "text-editors"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
cel-core = "0.4"
lsp-types = "0.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Native-only dependencies (tower-lsp server, proto support, etc.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cel-core-proto = "0.4"
dashmap = "5.5"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
toml = "0.8"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
expect-test = "1.5"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
